<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF385C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Napkin</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text:         #222222;
      --text-dim:     #6a6a6a;
      --text-muted:   #b0b0b0;
      --bg:           #ffffff;
      --bg-soft:      #f7f7f7;
      --border:       #dddddd;
      --red:          #FF385C;
      --red-hover:    #E31C5F;
      --red-light:    #fff0f3;
      --green:        #008A05;
      --green-light:  #ebfaeb;
      --radius-card:  20px;
      --radius-badge: 40px;
      --radius-input: 40px;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ── SCREENS ─────────────────────────────────────────── */
    .screen {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease, transform 300ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: translateY(0);
      -webkit-overflow-scrolling: touch;
    }
    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    /* Slide-up entrance: set this before adding .active */
    .screen.will-slide-up {
      transform: translateY(28px);
      opacity: 0;
    }

    /* ── PASSWORD GATE ───────────────────────────────────── */
    #screen-gate {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gate-inner {
      width: 100%;
      max-width: 360px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wordmark {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .tagline {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .gate-form {
      width: 100%;
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .pill-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 14px 20px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 150ms ease;
    }
    .pill-input::placeholder { color: var(--text-muted); }
    .pill-input:focus { border-color: var(--text); }
    .pill-input.error { border-color: var(--red); }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-6px); }
      80%      { transform: translateX(6px); }
    }
    .shake { animation: shake 350ms ease; }

    .btn-primary {
      width: 100%;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: var(--radius-badge);
      padding: 16px 0;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 150ms ease;
      min-height: 52px;
    }
    .btn-primary:hover { background: var(--red-hover); }

    /* ── HOME SCREEN ─────────────────────────────────────── */
    #screen-home {
      background: var(--bg-soft);
    }
    .home-inner {
      max-width: 480px;
      margin: 0 auto;
      padding: 56px 20px 80px; /* 80px bottom = footer height + gap */
    }
    .home-topbar .wordmark { display: block; }
    .home-greeting {
      margin-top: 8px;
      font-size: 26px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
    }
    .home-datetime {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .home-context {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-dim);
      font-style: italic;
      margin-top: 4px;
      min-height: 18px; /* reserve space even when empty */
    }
    .section-heading {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      margin-top: 24px;
    }
    .craving-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-badge);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      transition: background 150ms, border-color 150ms, color 150ms;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
    }
    .chip:hover { border-color: var(--text); }
    .chip.selected {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }

    /* ── HOME FOOTER (fixed to bottom of screen-home) ────── */
    .home-footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 48px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
    }
    .home-footer.centered {
      justify-content: center;
    }
    .footer-text {
      font-size: 13px;
      color: var(--text-muted);
    }
    .btn-refresh {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 44px;
      padding: 0;
      transition: color 150ms;
    }
    .btn-refresh:hover { color: var(--text-dim); }

    /* ── CARD DECK SCREEN ────────────────────────────────── */
    #screen-deck {
      background: var(--bg-soft);
    }
    .deck-inner {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .deck-topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px 20px;
    }
    .btn-back {
      position: absolute;
      left: 20px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      min-height: 48px;
      min-width: 48px;
    }
    .deck-topbar .wordmark { font-size: 20px; }
    .deck-progress {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    /* ── CARD STACK ──────────────────────────────────────── */
    .card-stack-area {
      width: 100%;
      padding: 0 20px 28px; /* bottom padding lets ghost cards breathe */
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .card-stack {
      position: relative;
      width: 100%;
      max-width: 390px;
    }

    /* Ghost cards: absolutely fill same space as active card slot */
    .ghost-cards {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    .ghost-card {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      border-radius: var(--radius-card);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      pointer-events: none;
    }
    /* transform-origin: bottom center so they peek out below the active card */
    .ghost-card-1 {
      transform-origin: bottom center;
      transform: scale(0.96) translateY(8px);
      opacity: 0.65;
      z-index: 2;
    }
    .ghost-card-2 {
      transform-origin: bottom center;
      transform: scale(0.92) translateY(16px);
      opacity: 0.35;
      z-index: 1;
    }

    /* Active draggable card */
    .active-card {
      position: relative;
      z-index: 3;
      background: var(--bg);
      border-radius: var(--radius-card);
      overflow: hidden;
      cursor: grab;
      user-select: none;
      box-shadow: 0 2px 16px rgba(0,0,0,0.10);
      will-change: transform;
      touch-action: pan-y; /* allow vertical scroll but we override on horizontal drag */
    }
    .active-card:active { cursor: grabbing; }
    .active-card.fly-left {
      transition: transform 300ms ease-in, opacity 260ms ease !important;
      transform: translateX(-110vw) rotate(-8deg) !important;
      opacity: 0;
    }
    .active-card.fly-right {
      transition: transform 300ms ease-in, opacity 260ms ease !important;
      transform: translateX(110vw) rotate(8deg) !important;
      opacity: 0;
    }

    /* Card photo */
    .card-photo {
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      border-radius: var(--radius-card) var(--radius-card) 0 0;
      background: var(--bg-soft);
      position: relative;
    }
    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
    }
    .card-photo-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
      background: var(--bg-soft);
      z-index: 0;
    }

    /* Card info */
    .card-info {
      padding: 12px 16px 16px;
    }
    .card-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 20px;
    }
    .card-cuisine {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-dim);
      line-height: 20px;
    }
    .stat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .stat-chip {
      border: 1px solid var(--border);
      background: var(--bg-soft);
      border-radius: var(--radius-badge);
      padding: 3px 10px;
      font-size: 13px;
      color: var(--text-dim);
    }
    /* Photo overlay badge row */
    .photo-badges {
      position: absolute;
      bottom: 8px;
      left: 8px;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .badge {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 40px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
    }
    .badge-line    { color: #222222; }
    .badge-market  { color: #008A05; }
    .badge-takeout { color: #008A05; }
    .badge-closed  { color: #717171; }
    .badge-satonly { color: #FF385C; }
    .card-note {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-dim);
      font-style: italic;
      margin-top: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Deck action buttons — secondary text links */
    .deck-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      width: 100%;
      padding: 0 20px;
    }
    .deck-actions-dot {
      color: var(--border);
      padding: 0 8px;
      font-size: 13px;
      user-select: none;
    }
    .btn-skip {
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
      font-family: inherit;
      cursor: pointer;
      min-height: 48px;
      padding: 12px 16px;
    }
    .btn-skip:hover { text-decoration: underline; }
    .btn-commit {
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 500;
      color: var(--red);
      font-family: inherit;
      cursor: pointer;
      min-height: 48px;
      padding: 12px 16px;
    }
    .btn-commit:hover { text-decoration: underline; }

    /* Swipe hint */
    @keyframes hint-left {
      0%, 100% { opacity: 0.5; transform: translateX(0); }
      50%       { opacity: 1;   transform: translateX(-4px); }
    }
    @keyframes hint-right {
      0%, 100% { opacity: 0.5; transform: translateX(0); }
      50%       { opacity: 1;   transform: translateX(4px); }
    }
    .swipe-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      margin-top: 12px;
      height: 24px;
      pointer-events: none;
    }
    .swipe-hint svg:first-child { animation: hint-left  1.5s ease-in-out infinite; }
    .swipe-hint svg:last-child  { animation: hint-right 1.5s ease-in-out infinite; }

    /* Empty state */
    .deck-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 0;
      gap: 12px;
    }
    .deck-empty p {
      font-size: 15px;
      color: var(--text-dim);
      text-align: center;
    }
    .btn-empty-action {
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 400;
      color: var(--red);
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 48px;
      padding: 4px 0;
    }
    .btn-empty-action:hover { text-decoration: underline; }

    /* ── COMMIT SCREEN ───────────────────────────────────── */
    #screen-commit {
      background: var(--bg);
    }
    .commit-inner {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 24px 48px;
      display: flex;
      flex-direction: column;
    }
    .btn-back-link {
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 400;
      color: var(--text-dim);
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .commit-name {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-top: 32px;
      line-height: 1.2;
    }
    .commit-cuisine {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-dim);
      text-align: center;
      margin-top: 8px;
    }
    .commit-address {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-dim);
      text-align: center;
      margin-top: 16px;
    }
    .commit-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 16px;
    }
    .commit-note {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-dim);
      font-style: italic;
      text-align: center;
      max-width: 300px;
      margin: 24px auto 0;
    }
    .commit-actions {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .btn-lets-go {
      width: 100%;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: var(--radius-badge);
      height: 52px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 150ms;
    }
    .btn-lets-go:hover { background: var(--red-hover); }
    .btn-not-this {
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 400;
      color: var(--text-dim);
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      min-height: 48px;
    }

    /* ── RESPONSIVE ──────────────────────────────────────── */
    @media (max-width: 359px) {
      .card-info {
        padding: 10px 12px 12px;
      }
      .chip {
        padding: 8px 14px;
        font-size: 13px;
      }
    }

    svg { flex-shrink: 0; }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════
     SCREEN 1: PASSWORD GATE
════════════════════════════════════════ -->
<div id="screen-gate" class="screen">
  <div class="gate-inner">
    <span class="wordmark">Napkin</span>
    <span style="display:inline-block;font-size:11px;font-weight:600;color:#6a6a6a;background:#f7f7f7;border:1px solid #dddddd;border-radius:40px;padding:3px 10px;letter-spacing:0.04em;margin-top:6px">BETA TESTING</span>
    <form class="gate-form" id="gate-form" autocomplete="off">
      <input
        id="gate-input"
        class="pill-input"
        type="password"
        placeholder="Password"
        autocomplete="off"
      >
      <button type="submit" class="btn-primary">Enter</button>
    </form>
  </div>
</div>

<!-- ════════════════════════════════════════
     SCREEN 2: HOME
════════════════════════════════════════ -->
<div id="screen-home" class="screen">
  <div class="home-inner">
    <div class="home-topbar">
      <span class="wordmark">Napkin</span>
    </div>
    <div class="home-greeting" id="home-greeting"></div>
    <div class="home-datetime" id="home-datetime"></div>
    <div class="home-context" id="home-context"></div>
    <div class="section-heading">What are you craving?</div>
    <div class="craving-chips" id="craving-chips">
      <button class="chip" data-craving="burgers">Burgers</button>
      <button class="chip" data-craving="mediterranean">Mediterranean</button>
      <button class="chip" data-craving="pizza">Pizza</button>
      <button class="chip" data-craving="asian">Japanese / Asian</button>
      <button class="chip" data-craving="breakfast">Breakfast</button>
      <button class="chip" data-craving="burritos">Burritos</button>
      <button class="chip" data-craving="sandwiches">Sandwiches</button>
      <button class="chip" data-craving="surprise">Surprise Me</button>
    </div>
  </div>
  <!-- Footer fixed to bottom of this screen -->
  <div class="home-footer centered" id="home-footer">
    <span class="footer-text" id="footer-text">Tap to refresh local events</span>
    <button class="btn-refresh" id="btn-refresh" aria-label="Refresh local events" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
      </svg>
    </button>
  </div>
</div>

<!-- ════════════════════════════════════════
     SCREEN 3: CARD DECK
════════════════════════════════════════ -->
<div id="screen-deck" class="screen">
  <div class="deck-inner">
    <div class="deck-topbar">
      <button class="btn-back" id="deck-back" aria-label="Go back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <span class="wordmark">Napkin</span>
    </div>
    <div class="deck-progress" id="deck-progress"></div>
    <div class="card-stack-area">
      <div class="card-stack" id="card-stack">
        <div class="ghost-cards" id="ghost-cards">
          <div class="ghost-card ghost-card-2" id="ghost-2"></div>
          <div class="ghost-card ghost-card-1" id="ghost-1"></div>
        </div>
        <div id="active-card-slot"></div>
      </div>
    </div>
    <div class="swipe-hint" id="swipe-hint" style="display:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
    <div class="deck-actions" id="deck-actions">
      <button class="btn-skip" id="btn-skip">Skip</button>
      <span class="deck-actions-dot" aria-hidden="true">·</span>
      <button class="btn-commit" id="btn-commit">This is it</button>
    </div>
    <div class="deck-empty" id="deck-empty" style="display:none">
      <p id="deck-empty-msg">No more spots right now.</p>
      <button class="btn-empty-action" id="btn-empty-action">
        <svg id="empty-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"></polyline>
          <line x1="4" y1="20" x2="21" y2="3"></line>
          <polyline points="21 16 21 21 16 21"></polyline>
          <line x1="15" y1="15" x2="21" y2="21"></line>
        </svg>
        <span id="empty-action-label">Shuffle</span>
      </button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════
     SCREEN 4: COMMIT
════════════════════════════════════════ -->
<div id="screen-commit" class="screen">
  <div class="commit-inner">
    <button class="btn-back-link" id="commit-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Back
    </button>
    <div class="commit-name" id="commit-name"></div>
    <div class="commit-cuisine" id="commit-cuisine"></div>
    <div class="commit-address" id="commit-address"></div>
    <div class="commit-badges" id="commit-badges"></div>
    <div class="commit-note" id="commit-note"></div>
    <div class="commit-actions">
      <button class="btn-lets-go" id="btn-lets-go">Let's go</button>
      <button class="btn-not-this" id="btn-not-this">Not this one</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════
let spots = [];
let deck  = [];
let deckIndex = 0;
let deckIsNoMatchFallback = false; // true when deck is empty because nothing matched craving
let selectedSpot = null;
let selectedCraving = null;

// ════════════════════════════════════════════════════════
//  UTILITIES
// ════════════════════════════════════════════════════════
function nowParts() {
  const now  = new Date();
  const days = ['sun','mon','tue','wed','thu','fri','sat'];
  const day  = days[now.getDay()];
  const hour = now.getHours() + now.getMinutes() / 60;
  return { now, day, hour };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function priceStr(n) { return '$'.repeat(n); }

function photoSrcForSpot(spot) {
  return spot.photo || '';
}

function isAvailableSpot(spot) {
  return !spot.status || spot.status === 'active';
}

function isCuratedSpot(spot) {
  return (spot.priorityScore || 0) >= 2;
}

function preferCuratedSpots(arr) {
  const curated = arr.filter(isCuratedSpot);
  return curated.length ? curated : arr;
}

async function checkAuth() {
  try {
    const res = await fetch('/.netlify/functions/auth', {
      credentials: 'same-origin'
    });
    if (!res.ok) return false;
    const data = await res.json();
    return data.authenticated === true;
  } catch (_) {
    return false;
  }
}

async function submitPassword(password) {
  const res = await fetch('/.netlify/functions/auth', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });

  let data = {};
  try {
    data = await res.json();
  } catch (_) {}

  if (!res.ok || data.authenticated !== true) {
    throw new Error(data.error || 'Invalid password');
  }
}

// ════════════════════════════════════════════════════════
//  OPEN-NOW LOGIC
// ════════════════════════════════════════════════════════
function isOpenNow(spot) {
  const { day, hour } = nowParts();
  if (spot.specialRule === 'saturday_market_only') {
    return day === 'sat' && hour >= 8 && hour < 12;
  }
  const h = spot.hours[day];
  if (!h) return false;
  if (typeof h[0] === 'number') return hour >= h[0] && hour < h[1];
  return h.some(w => hour >= w[0] && hour < w[1]);
}

// ════════════════════════════════════════════════════════
//  SITUATION BADGES
// ════════════════════════════════════════════════════════
function getSituationBadges(spot) {
  const { day, hour } = nowParts();
  const badges = [];
  if (spot.lineWarning) badges.push('Line Expected');
  if (spot.takeout)     badges.push('Takeout Ready');
  // "Closed Today" only for spots in the deck whose hours today exist
  // but current time is outside them — spots with null hours are hard-suppressed
  if (spot.specialRule !== 'saturday_market_only' && spot.hours[day] !== null) {
    const h = spot.hours[day];
    const openNow = Array.isArray(h[0])
      ? h.some(w => hour >= w[0] && hour < w[1])
      : hour >= h[0] && hour < h[1];
    if (!openNow) badges.push('Closed Today');
  }
  if (spot.specialRule === 'saturday_market_only') {
    const isMarketNow = day === 'sat' && hour >= 8 && hour < 12;
    if (isMarketNow) badges.push('Market Morning');
    else             badges.push('Sat Market Only');
  }
  return badges;
}

function badgeClass(label) {
  const map = {
    'Line Expected':  'badge badge-line',
    'Market Morning': 'badge badge-market',
    'Takeout Ready':  'badge badge-takeout',
    'Closed Today':   'badge badge-closed',
    'Sat Market Only':'badge badge-satonly',
  };
  return map[label] || 'badge';
}

// ════════════════════════════════════════════════════════
//  HARD SUPPRESSION — spots removed entirely from deck
// ════════════════════════════════════════════════════════
function isHardSuppressed(spot) {
  const { day, hour } = nowParts();
  // Suppress any spot whose hours for today are null
  if (spot.specialRule !== 'saturday_market_only' && spot.hours[day] === null) return true;
  // Dragon Valley is closed 3–4pm daily (gap between services)
  if (spot.id === 'dragonvalley' && hour >= 15 && hour < 16) return true;
  return false;
}

// ════════════════════════════════════════════════════════
//  RECENCY TRACKING
// ════════════════════════════════════════════════════════
function getRecent() {
  try {
    const raw = localStorage.getItem('napkin_recent');
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (Date.now() - parsed.ts > 48 * 60 * 60 * 1000) {
      localStorage.removeItem('napkin_recent');
      return [];
    }
    return parsed.ids || [];
  } catch (_) { return []; }
}

function addRecent(id) {
  const ids = getRecent();
  const updated = [id, ...ids.filter(i => i !== id)].slice(0, 3);
  localStorage.setItem('napkin_recent', JSON.stringify({ ids: updated, ts: Date.now() }));
}

// ════════════════════════════════════════════════════════
//  CONTEXT SCORING
// ════════════════════════════════════════════════════════
function contextScore(spot) {
  const { day, hour } = nowParts();
  const weekdays = ['mon','tue','wed','thu','fri'];
  const recent = getRecent();
  let score = spot.priorityScore || 0;

  // Time of day
  if (hour >= 6  && hour < 10 && spot.type.includes('breakfast')) score += 3;
  if (hour >= 11 && hour < 14 && spot.type.includes('lunch'))     score += 2;
  if (hour >= 17 && hour < 22 && spot.type.includes('dinner'))    score += 3;
  if (hour >= 14 && hour < 17 && spot.takeout)                    score += 1;

  // Day-specific
  if (day === 'sat' && hour >= 8 && hour < 12 && spot.id === 'earthsbounty') score += 5;
  if ((day === 'fri' || day === 'sat') && hour >= 17 && spot.id === 'amami') score += 2;
  if (weekdays.includes(day) && hour >= 11 && hour < 14) {
    if (spot.id === 'papajoes' || spot.id === 'dragonvalley') score += 1;
  }

  // Recency penalty
  if (recent.includes(spot.id)) score -= 2;

  return score;
}

function sortByScore(arr) {
  return [...arr].sort((a, b) => contextScore(b) - contextScore(a));
}

// ════════════════════════════════════════════════════════
//  FILTER BY CRAVING
// ════════════════════════════════════════════════════════
function filterByCraving(craving) {
  const eligible = spots.filter(s => isAvailableSpot(s) && !isHardSuppressed(s) && isOpenNow(s));
  if (craving === 'surprise') return sortByScore(preferCuratedSpots(eligible));
  // Return only exact craving matches — no silent fallback
  return sortByScore(preferCuratedSpots(eligible.filter(s => s.cravingMatch.includes(craving))));
}

// ════════════════════════════════════════════════════════
//  CRAVING CHIP REORDER
// ════════════════════════════════════════════════════════
function reorderCravingChips() {
  const { day, hour } = nowParts();
  const container = document.getElementById('craving-chips');
  const chips = [...container.querySelectorAll('.chip')];

  let order;
  if (day === 'sat' && hour >= 8 && hour < 12) {
    order = ['burritos','breakfast','sandwiches','burgers','mediterranean','pizza','asian','surprise'];
  } else if (hour < 11) {
    order = ['breakfast','burritos','sandwiches','burgers','mediterranean','pizza','asian','surprise'];
  } else if (hour < 15) {
    order = ['sandwiches','pizza','burgers','asian','mediterranean','breakfast','burritos','surprise'];
  } else if (hour >= 17) {
    order = ['asian','burgers','pizza','mediterranean','sandwiches','burritos','breakfast','surprise'];
  } else {
    return; // 3–5pm: no reorder
  }

  order.forEach(craving => {
    const chip = chips.find(c => c.dataset.craving === craving);
    if (chip) container.appendChild(chip);
  });
}

// ════════════════════════════════════════════════════════
//  CONTEXT SUBTEXT
// ════════════════════════════════════════════════════════
function getContextSubtext() {
  const { day, hour } = nowParts();
  const weekdays = ['mon','tue','wed','thu','fri'];
  if (day === 'sat' && hour >= 8 && hour < 12)            return "Farmers market is on. Earth's Bounty is there.";
  if (hour >= 17 && hour < 19)                            return "Happy hour window. Check Amami.";
  if ((day === 'fri' || day === 'sat') && hour >= 17)     return "Good night for a sit-down.";
  if (weekdays.includes(day) && hour >= 11 && hour < 14) return "Quick options are up front.";
  return '';
}

// ════════════════════════════════════════════════════════
//  SCREEN TRANSITIONS
// ════════════════════════════════════════════════════════
function showScreen(id, { slideUp = false } = {}) {
  // Deactivate all screens
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active', 'will-slide-up');
  });

  const next = document.getElementById(id);

  if (slideUp) {
    // Prime the starting position
    next.classList.add('will-slide-up');
    // Double rAF: first frame commits the class, second frame triggers transition
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        next.classList.remove('will-slide-up');
        next.classList.add('active');
      });
    });
  } else {
    next.classList.add('active');
  }
}

// ════════════════════════════════════════════════════════
//  HOME SCREEN SETUP
// ════════════════════════════════════════════════════════
function setupHome() {
  const { now, day, hour } = nowParts();

  // Greeting
  let greeting;
  if (hour < 11)      greeting = 'Good morning, Wilson family.';
  else if (hour < 15) greeting = "What's for lunch?";
  else if (hour < 18) greeting = 'Afternoon, Wilson family.';
  else                greeting = 'Dinner time.';
  document.getElementById('home-greeting').textContent = greeting;

  // Datetime
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const hh = now.getHours();
  const mm = now.getMinutes();
  const ampm = hh >= 12 ? 'PM' : 'AM';
  const h12 = hh > 12 ? hh - 12 : hh === 0 ? 12 : hh;
  document.getElementById('home-datetime').textContent =
    `${dayNames[now.getDay()]} · ${h12}:${String(mm).padStart(2,'0')} ${ampm}`;

  // Context subtext
  document.getElementById('home-context').textContent = getContextSubtext();

  // Reorder craving chips by time of day
  reorderCravingChips();

  setupFooter();
}

// ════════════════════════════════════════════════════════
//  EVENT CACHE / FOOTER
// ════════════════════════════════════════════════════════
let footerListenerAdded = false;

async function setupFooter() {
  const lastRefresh = localStorage.getItem('napkin_last_refresh');
  const now = Date.now();
  const threeDays = 3 * 24 * 60 * 60 * 1000;

  if (!lastRefresh || (now - parseInt(lastRefresh, 10)) > threeDays) {
    await fetchEvents();
  }

  updateFooterDisplay();

  if (!footerListenerAdded) {
    footerListenerAdded = true;
    document.getElementById('btn-refresh').addEventListener('click', async () => {
      document.getElementById('footer-text').textContent = 'Updating...';
      await fetchEvents();
      updateFooterDisplay();
    });
    // Also make the footer text clickable when no cache
    document.getElementById('footer-text').addEventListener('click', async () => {
      const ft = document.getElementById('footer-text');
      if (ft.textContent === 'Tap to refresh local events') {
        ft.textContent = 'Updating...';
        await fetchEvents();
        updateFooterDisplay();
      }
    });
  }
}

function updateFooterDisplay() {
  const footer    = document.getElementById('home-footer');
  const footerText= document.getElementById('footer-text');
  const btnRefresh= document.getElementById('btn-refresh');
  const lastRefresh = localStorage.getItem('napkin_last_refresh');

  if (!lastRefresh) {
    footer.classList.add('centered');
    footerText.textContent = 'Tap to refresh local events';
    footerText.style.cursor = 'pointer';
    btnRefresh.style.display = 'none';
    return;
  }

  footer.classList.remove('centered');
  footerText.style.cursor = '';
  btnRefresh.style.display = 'flex';

  const diffMs   = Date.now() - parseInt(lastRefresh, 10);
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (diffDays === 0)      footerText.textContent = 'Updated today';
  else if (diffDays === 1) footerText.textContent = 'Updated 1 day ago';
  else                     footerText.textContent = `Updated ${diffDays} days ago`;
}

async function fetchEvents() {
  const today = new Date().toISOString().slice(0, 10);
  const prompt = `What is happening in Napa, CA food and event scene this week that would affect where a local family eats? Check for: current farmers market schedule, any major downtown events, notable restaurant happy hours or weekly specials. Today is ${today}. Return ONLY valid JSON with no markdown formatting and no explanation: { "events": [{"title": string, "relevance": string, "badge": string, "dayMatch": string}], "lastUpdated": string }`;
  try {
    const res = await fetch('/.netlify/functions/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: prompt }] })
    });
    if (!res.ok) return false;

    const data = await res.json();
    if (!data.text) return false;

    const parsed = JSON.parse(data.text);
    if (!parsed || !Array.isArray(parsed.events) || typeof parsed.lastUpdated !== 'string') {
      return false;
    }

    localStorage.setItem('napkin_event_cache', JSON.stringify(parsed));
    localStorage.setItem('napkin_last_refresh', String(Date.now()));
    return true;
  } catch (_) {
    return false;
  }
}

// ════════════════════════════════════════════════════════
//  BUILD CARD HTML
// ════════════════════════════════════════════════════════
function buildCardEl(spot) {
  const badges = getSituationBadges(spot);
  const card   = document.createElement('div');
  card.className  = 'active-card';
  card.dataset.id = spot.id;

  const badgesHTML = badges.map(b => `<span class="${badgeClass(b)}">${b}</span>`).join('');
  const noteHTML   = spot.note ? `<div class="card-note">${spot.note}</div>` : '';
  const photoSrc   = photoSrcForSpot(spot);
  const imageHTML  = photoSrc
    ? `<img src="${photoSrc}" alt="${spot.name}" onerror="this.style.display='none'">`
    : '';

  card.innerHTML = `
    <div class="card-photo">
      <div class="card-photo-placeholder">${spot.cuisine}</div>
      ${imageHTML}
      ${badges.length ? `<div class="photo-badges">${badgesHTML}</div>` : ''}
    </div>
    <div class="card-info">
      <div class="card-name">${spot.name}</div>
      <div class="card-cuisine">${spot.cuisine}</div>
      <div class="stat-chips">
        <span class="stat-chip">${spot.speedRating}</span>
        <span class="stat-chip">${priceStr(spot.price)}</span>
        <span class="stat-chip">${spot.romeOk ? 'Rome OK' : '\u2014'}</span>
      </div>
      ${noteHTML}
    </div>
  `;
  return card;
}

// ════════════════════════════════════════════════════════
//  DECK SCREEN
// ════════════════════════════════════════════════════════
function openDeck(craving) {
  selectedCraving = craving;
  const matched = filterByCraving(craving);

  if (matched.length === 0 && craving !== 'surprise') {
    // No spots open for this craving — show empty state immediately
    deck = [];
    deckIsNoMatchFallback = true;
  } else {
    deck = matched;
    deckIsNoMatchFallback = false;
  }

  deckIndex = 0;
  renderDeck();
  showScreen('screen-deck', { slideUp: true });
}

function renderDeck() {
  const slot    = document.getElementById('active-card-slot');
  const progress= document.getElementById('deck-progress');
  const actions = document.getElementById('deck-actions');
  const empty   = document.getElementById('deck-empty');
  const ghosts  = document.getElementById('ghost-cards');
  const emptyMsg= document.getElementById('deck-empty-msg');
  const emptyIcon= document.getElementById('empty-icon');
  const emptyLabel= document.getElementById('empty-action-label');

  slot.innerHTML = '';

  if (deck.length === 0 || deckIndex >= deck.length) {
    actions.style.display = 'none';
    empty.style.display   = 'flex';
    ghosts.style.display  = 'none';
    progress.textContent  = '';

    // Distinguish: no craving match vs. ran out of cards
    if (deckIsNoMatchFallback || deck.length === 0) {
      emptyMsg.textContent   = 'Nothing open right now for that craving.';
      emptyIcon.style.display= 'none';
      emptyLabel.textContent = 'Show all open spots';
      document.getElementById('btn-empty-action').dataset.mode = 'show-all';
    } else {
      emptyMsg.textContent   = 'No more spots right now.';
      emptyIcon.style.display= 'inline';
      emptyLabel.textContent = 'Shuffle';
      document.getElementById('btn-empty-action').dataset.mode = 'shuffle';
    }
    return;
  }

  actions.style.display = 'flex';
  empty.style.display   = 'none';
  ghosts.style.display  = 'block';

  const remaining = deck.length - deckIndex;
  progress.textContent = `${deckIndex + 1} of ${deck.length}`;

  document.getElementById('ghost-1').style.display = remaining > 1 ? 'block' : 'none';
  document.getElementById('ghost-2').style.display = remaining > 2 ? 'block' : 'none';

  const isFirstCard = deckIndex === 0 && !localStorage.getItem('napkin_seen_hint');
  const cardEl = buildCardEl(deck[deckIndex]);
  slot.appendChild(cardEl);
  attachDragBehavior(cardEl, isFirstCard);

  // Show swipe hint on first card of first-ever session
  const hint = document.getElementById('swipe-hint');
  if (isFirstCard) {
    hint.style.display = 'flex';
    setTimeout(dismissSwipeHint, 4000);
  } else {
    hint.style.display = 'none';
  }
}

function skipCard() {
  deckIndex++;
  renderDeck();
}

function commitCard() {
  selectedSpot = deck[deckIndex];
  openCommitScreen(selectedSpot);
}

// ════════════════════════════════════════════════════════
//  DRAG BEHAVIOR — touch + mouse, spring snap-back
// ════════════════════════════════════════════════════════
function dismissSwipeHint() {
  const hint = document.getElementById('swipe-hint');
  if (hint && hint.style.display !== 'none') {
    hint.style.display = 'none';
    localStorage.setItem('napkin_seen_hint', '1');
  }
}

function attachDragBehavior(card, isFirstCard) {
  let startX = 0, startY = 0, currentX = 0;
  let dragging = false;
  let lockAxis = null;
  const THRESHOLD = 60;
  const TINT_START = 30;
  const SPRING = 'transform 350ms cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 350ms ease';

  function setTint(dx) {
    const abs = Math.abs(dx);
    if (abs < TINT_START) {
      card.style.boxShadow = '0 2px 16px rgba(0,0,0,0.10)';
      return;
    }
    const intensity = Math.min((abs - TINT_START) / (THRESHOLD - TINT_START), 1);
    if (dx > 0) {
      card.style.boxShadow = `0 2px 16px rgba(0,0,0,0.10), inset 0 0 0 2px rgba(0,138,5,${(intensity * 0.15).toFixed(2)})`;
    } else {
      card.style.boxShadow = `0 2px 16px rgba(0,0,0,0.10), inset 0 0 0 2px rgba(255,56,92,${(intensity * 0.15).toFixed(2)})`;
    }
  }

  function onStart(x, y) {
    startX   = x;
    startY   = y;
    currentX = 0;
    lockAxis = null;
    dragging = true;
    card.style.transition = 'none';
    card.classList.add('dragging');
    if (isFirstCard) dismissSwipeHint();
  }

  function onMove(x, y) {
    if (!dragging) return;
    const dx = x - startX;
    const dy = y - startY;
    if (!lockAxis && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
      lockAxis = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v';
    }
    if (lockAxis === 'v') return;
    currentX = dx;
    const rot = currentX * 0.05;
    card.style.transform = `translateX(${currentX}px) rotate(${rot}deg)`;
    setTint(currentX);
  }

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('dragging');

    if (lockAxis === 'v') {
      card.style.transition = '';
      return;
    }

    if (currentX < -THRESHOLD) {
      card.classList.add('fly-left');
      setTimeout(skipCard, 320);
    } else if (currentX > THRESHOLD) {
      card.classList.add('fly-right');
      setTimeout(commitCard, 320);
    } else {
      // Spring snap-back — tint fades with the spring
      card.style.transition = SPRING;
      card.style.transform  = '';
      card.style.boxShadow  = '0 2px 16px rgba(0,0,0,0.10)';
      card.addEventListener('transitionend', () => {
        card.style.transition = '';
      }, { once: true });
    }
  }

  // Mouse
  card.addEventListener('mousedown', e => {
    e.preventDefault();
    onStart(e.clientX, e.clientY);
  });
  const onMouseMove = e => onMove(e.clientX, e.clientY);
  const onMouseUp   = () => { if (dragging) onEnd(); };
  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup', onMouseUp);

  // Touch
  card.addEventListener('touchstart', e => {
    const t = e.touches[0];
    onStart(t.clientX, t.clientY);
  }, { passive: true });

  card.addEventListener('touchmove', e => {
    if (!dragging) return;
    const t = e.touches[0];
    const dx = Math.abs(t.clientX - startX);
    const dy = Math.abs(t.clientY - startY);
    if (!lockAxis && dx > dy) e.preventDefault();
    onMove(t.clientX, t.clientY);
  }, { passive: false });

  card.addEventListener('touchend', () => { if (dragging) onEnd(); });

  // Cleanup
  const observer = new MutationObserver(() => {
    if (!document.contains(card)) {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
      observer.disconnect();
    }
  });
  observer.observe(document.getElementById('active-card-slot'), { childList: true });
}

// ════════════════════════════════════════════════════════
//  COMMIT SCREEN
// ════════════════════════════════════════════════════════
function openCommitScreen(spot) {
  const badges = getSituationBadges(spot);
  document.getElementById('commit-name').textContent    = spot.name;
  document.getElementById('commit-cuisine').textContent = spot.cuisine;
  document.getElementById('commit-address').textContent = spot.address;
  document.getElementById('commit-note').textContent    = spot.note || '';
  document.getElementById('commit-badges').innerHTML    =
    badges.map(b => `<span class="${badgeClass(b)}">${b}</span>`).join('');
  showScreen('screen-commit');
}

// ════════════════════════════════════════════════════════
//  EVENT WIRING
// ════════════════════════════════════════════════════════

// Password gate
document.getElementById('gate-form').addEventListener('submit', async e => {
  e.preventDefault();
  const input = document.getElementById('gate-input');
  try {
    await submitPassword(input.value);
    input.classList.remove('error');
    input.value = '';
    showScreen('screen-home');
    setupHome();
  } catch (_) {
    input.classList.add('error');
    input.classList.remove('shake');
    void input.offsetWidth;
    input.classList.add('shake');
    input.value = '';
    setTimeout(() => input.classList.remove('error', 'shake'), 2000);
  }
});

// Craving chips
document.getElementById('craving-chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  chip.classList.add('selected');
  setTimeout(() => openDeck(chip.dataset.craving), 100);
});

// Deck: back to home
document.getElementById('deck-back').addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  showScreen('screen-home');
});

// Deck: skip button
document.getElementById('btn-skip').addEventListener('click', skipCard);

// Deck: commit button
document.getElementById('btn-commit').addEventListener('click', commitCard);

// Deck: empty state action button
document.getElementById('btn-empty-action').addEventListener('click', () => {
  const mode = document.getElementById('btn-empty-action').dataset.mode;
  if (mode === 'show-all') {
    // Show all currently open spots regardless of craving
    deck = shuffle(preferCuratedSpots(spots.filter(s => isAvailableSpot(s) && isOpenNow(s))));
    deckIsNoMatchFallback = false;
    deckIndex = 0;
    renderDeck();
  } else {
    openDeck('surprise');
  }
});

// Commit: back to deck
document.getElementById('commit-back').addEventListener('click', () => {
  showScreen('screen-deck');
  renderDeck();
});

// Commit: let's go — record recency + open Apple Maps
document.getElementById('btn-lets-go').addEventListener('click', () => {
  if (selectedSpot) {
    addRecent(selectedSpot.id);
    const query = encodeURIComponent(selectedSpot.name + ' ' + selectedSpot.address);
    window.open(`https://maps.apple.com/?q=${query}`, '_blank');
  }
});

// Commit: not this one
document.getElementById('btn-not-this').addEventListener('click', () => {
  deckIndex++;
  renderDeck();
  showScreen('screen-deck');
});

// ════════════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════════════
async function boot() {
  try {
    const res = await fetch('/spots.json');
    spots = await res.json();
  } catch (_) {
    spots = [];
  }

  if (await checkAuth()) {
    showScreen('screen-home');
    setupHome();
  } else {
    showScreen('screen-gate');
  }
}

boot();

// ════════════════════════════════════════════════════════
//  SERVICE WORKER
// ════════════════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
